name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check graded cells ship with cleared outputs
        run: python tools/check_outputs.py

      - name: Run full test suite (notebooks + agentlib unit tests)
        run: >
          pytest --nbmake curriculum/*.ipynb interview_prep/*.ipynb capstone/*.ipynb tests/
        env:
          # Intentionally no LLM_PROVIDER / API key secrets here -- every notebook must pass
          # cleanly through its deterministic mock fallback with no key present, exactly as
          # this repo's own build sessions verified locally. See README's "AI-assisted
          # content and human review" section and PROGRESS.md's Unit 13 notes.
          CI: "true"
          # Graded cells raise NotImplementedError on a fresh clone, which is the whole point
          # of them -- so CI grades the reference implementations in solutions/reference/
          # instead of the empty learner stubs. Side effect worth having: every CI run proves
          # each case suite is passable and each reference answer is still correct.
          GRADER_MODE: reference
